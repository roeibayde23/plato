<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F0E6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PLATO">
  <title>PLATO — מעקב בריא בהישג יד</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css?v=12">
  <script>
    window.APP_VERSION = "12";
    window.APP_BASE = (function () {
      var path = location.pathname;
      if (/\/index\.html$/.test(path)) path = path.replace(/index\.html$/, "");
      if (path.charAt(path.length - 1) !== "/") path += "/";
      return path;
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="sheet"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="js/ingredients.js?v=12"></script>
  <script src="js/store.js?v=12"></script>
  <script src="js/config.js?v=12"></script>
  <script src="js/cloud.js?v=12"></script>
  <script src="js/app.js?v=12"></script>
  <script>
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      (function () {
        var version = window.APP_VERSION || "12";
        var swUrl = window.APP_BASE + "sw.js";
        function markReloaded() { try { sessionStorage.setItem("plato-sw-reloaded", version); } catch (e) {} }
        function alreadyReloaded() { try { return sessionStorage.getItem("plato-sw-reloaded") === version; } catch (e) { return false; } }
        var reloading = false;
        function reloadOnce() {
          if (reloading || alreadyReloaded()) return;
          reloading = true; markReloaded(); location.reload();
        }
        navigator.serviceWorker.register(swUrl, { scope: window.APP_BASE }).then(function (reg) {
          try { reg.update(); } catch (e) {}
        }).catch(function () {});
        navigator.serviceWorker.addEventListener("controllerchange", reloadOnce);
        navigator.serviceWorker.addEventListener("message", function (event) {
          var data = event.data || {};
          if (data.type === "SW_UPDATED") reloadOnce();
        });
      })();
    }
  </script>
</body>
</html>
